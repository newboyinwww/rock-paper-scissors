<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>가위바위보 게임</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="game">

        <h1>✌️ 가위바위보 게임 ✊</h1>

        <p class="game-rule">🏆 3판 2선승제</p>

        <div id="result">
            무엇을 낼까요?
        </div>

        <div class="choices">
            <button onclick="play('가위')">✌️<br>가위</button>
            <button onclick="play('바위')">✊<br>바위</button>
            <button onclick="play('보')">✋<br>보</button>
        </div>

        <div class="score-board">

            <div class="player-score">
                <div>나</div>
                <div id="myRounds" class="rounds">
                    ⚪ ⚪
                </div>
            </div>

            <div class="vs">VS</div>

            <div class="player-score">
                <div>컴퓨터</div>
                <div id="computerRounds" class="rounds">
                    ⚪ ⚪
                </div>
            </div>

        </div>

        <button id="resetButton" onclick="resetGame()">
            🔄 재도전
        </button>

    </div>

    <script src="script.js"></script>

</body>
</html>
